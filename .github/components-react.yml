name: React Components

on:
  push:
    paths:
      - 'packages/components/react/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/components-react.yml'
  pull_request:
    paths:
      - 'packages/components/react/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/components-react.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate React components
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @notable/react exec playwright install --with-deps chromium

      - name: Build components
        run: pnpm --filter @notable/react build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm --filter @notable/react test:all
